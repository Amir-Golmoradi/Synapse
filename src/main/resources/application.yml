# Active profile is selected externally via SPRING_PROFILES_ACTIVE.
# Do NOT set spring.profiles.active here — it must stay identical on every branch.
server:
  port: ${SYNAPSE_SERVICE_HOST_PORT}
spring:
  application:
    name: Synapse
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
    user:
      name: user
      password: user
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_HOST_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations:
      - classpath:db/create-table
      - classpath:db/alter-table
  data:
    redis:
      connect-timeout: 200ms
      timeout: 200ms
      repositories:
        enabled: false
  servlet:
    multipart:
      file-size-threshold: 0B
      max-file-size: 25MB
      max-request-size: 26MB
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    operations-sorter: method
    tags-sorter: alpha

synapse:
  google-token-url: ${GOOGLE_TOKEN_INFO_URL}
  websocket:
    allowed-origins: ${SYNAPSE_WEBSOCKET_ALLOWED_ORIGINS:}
  call:
    ringing-timeout: ${SYNAPSE_CALL_RINGING_TIMEOUT:45s}
    connection-timeout: ${SYNAPSE_CALL_CONNECTION_TIMEOUT:30s}
    recovery-timeout: ${SYNAPSE_CALL_RECOVERY_TIMEOUT:30s}
    liveness-lease: ${SYNAPSE_CALL_LIVENESS_LEASE:30s}
    timeout-sweep: ${SYNAPSE_CALL_TIMEOUT_SWEEP:1s}
    timeout-batch-size: ${SYNAPSE_CALL_TIMEOUT_BATCH_SIZE:100}
  messaging:
    video:
      storage-root: ${SYNAPSE_VIDEO_STORAGE_ROOT:.synapse/media}
      max-file-size: 25MB
      max-duration: 60s
      max-dimension: 1920
      max-pixels: 2073600
      probe-timeout: 5s
      staging-grace: 1h
      orphan-grace: 24h
      cleanup-interval: 1h
      cleanup-batch-size: 1000
  jwt:
    secret: ${JWT_SECRET}
    token-expiration-ms: 900000          # 15 minutes — short-lived
  refresh-token:
    validity-days: 30              # 30-day refresh window
